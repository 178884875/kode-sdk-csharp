# KodaClaw — Production docker-compose
# Uses pre-built image from Alibaba Cloud Container Registry.
#
# Quick install (Linux / macOS):
#   curl -fsSL https://raw.githubusercontent.com/JinFanZheng/kode-sdk-csharp/main/products/KodaClaw/scripts/docker-install.sh | bash
#
# Manual start:
#   docker compose -f docker-compose.prod.yml up -d

services:
  kodaclaw:
    image: registry.cn-hangzhou.aliyuncs.com/vanzheng/kodaclaw:latest
    ports:
      - "5076:5076"
    volumes:
      - ./data:/data
    environment:
      # ── API Key — Recommended: configure via Setup Wizard ──────────────────
      # Open http://localhost:5076/setup after starting to configure your model,
      # API key, and base URL interactively. Supports Anthropic, OpenAI, GLM,
      # DeepSeek, Qwen, and any compatible endpoint.
      #
      # ── Advanced: configure via environment variables ───────────────────────
      # Use this only for automated/server deployments without a browser.
      # Both a key AND a base URL are required for non-Anthropic/OpenAI endpoints.
      #
      # Anthropic-compatible (GLM, etc.):
      # ANTHROPIC_API_KEY: "your-key"
      # ANTHROPIC_BASE_URL: "https://open.bigmodel.cn/api/anthropic"
      # KODACLAW_DEFAULT_MODEL: "GLM-4.5"
      #
      # OpenAI-compatible (DeepSeek, Qwen, etc.):
      # OPENAI_API_KEY: "your-key"
      # OPENAI_BASE_URL: "https://api.deepseek.com/v1"
      # KODACLAW_DEFAULT_MODEL: "deepseek-chat"

      # ── Gateway settings ──
      KODACLAW_GATEWAY_URL: "http://0.0.0.0:5076"
      KODACLAW_WORKSPACE_ROOT: "/data/workspace"
      ASPNETCORE_ENVIRONMENT: "Production"

      # ── web-tools: point to local SearXNG for higher throughput search ──
      SEARXNG_URL: "http://searxng:8080"

      # ── Optional: OpenTelemetry (uncomment to enable) ──
      # OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    depends_on:
      searxng:
        condition: service_started   # SearXNG 是可选后端，进程启动即可，不阻塞 KodaClaw
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5076/healthz"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  searxng:
    image: searxng/searxng:latest
    volumes:
      - ./data/searxng:/etc/searxng
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

