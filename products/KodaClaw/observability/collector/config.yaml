receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 512
  memory_limiter:
    check_interval: 5s
    limit_mib: 256

exporters:
  # Traces → Jaeger（OTLP 端口，Docker 内网直连）
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # Metrics → Prometheus（Collector 暴露 /metrics 端点，Prometheus 来刮）
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: kodaclaw
    resource_to_telemetry_conversion:
      enabled: true

  # Logs → stdout（开发期直接看容器日志）
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/jaeger]

    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
