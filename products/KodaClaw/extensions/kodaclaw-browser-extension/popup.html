<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KodaClaw Browser Bridge</title>
  <style>
    /* ====== 全局重置 & 深色主题 ====== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 340px;
      min-height: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      padding: 16px;
    }

    /* ====== 头部 ====== */
    .header {
      text-align: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid #2a2a4a;
    }

    .header h1 {
      font-size: 16px;
      font-weight: 600;
      color: #00d4aa;
      letter-spacing: 0.5px;
    }

    .header .subtitle {
      font-size: 11px;
      color: #888;
      margin-top: 4px;
    }

    /* ====== 连接状态 ====== */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: #16213e;
      border-radius: 8px;
      margin-bottom: 16px;
      border: 1px solid #2a2a4a;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ff4757;
      flex-shrink: 0;
      transition: background 0.3s;
    }

    .status-dot.connected {
      background: #00d4aa;
      box-shadow: 0 0 6px rgba(0, 212, 170, 0.5);
    }

    .status-dot.connecting,
    .status-dot.reconnecting {
      background: #ffa502;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .status-text {
      font-size: 13px;
      color: #ccc;
    }

    /* ====== 表单区域 ====== */
    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      color: #888;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input {
      width: 100%;
      padding: 8px 12px;
      background: #16213e;
      border: 1px solid #2a2a4a;
      border-radius: 6px;
      color: #e0e0e0;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: #00d4aa;
    }

    .form-group input::placeholder {
      color: #555;
    }

    /* ====== Token 区域 ====== */
    .token-display {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .token-display input {
      flex: 1;
    }

    .token-display .token-status {
      font-size: 18px;
      flex-shrink: 0;
    }

    /* ====== 按钮 ====== */
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    .btn {
      flex: 1;
      padding: 10px 0;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn:hover {
      opacity: 0.85;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: #00d4aa;
      color: #1a1a2e;
    }

    .btn-danger {
      background: #ff4757;
      color: #fff;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    /* ====== 设备信息 ====== */
    .device-info {
      background: #16213e;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 14px;
      display: none;
    }

    .device-info.visible {
      display: block;
    }

    .device-info .device-label {
      font-size: 10px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .device-info .device-id {
      font-size: 12px;
      color: #00d4aa;
      font-family: monospace;
    }

    .device-info .device-paired {
      font-size: 11px;
      color: #666;
      margin-top: 2px;
    }

    /* ====== Toast 通知 ====== */
    .toast-container {
      position: fixed;
      bottom: 12px;
      left: 12px;
      right: 12px;
      z-index: 999;
      pointer-events: none;
    }

    .toast {
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      margin-top: 6px;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .toast.info    { background: #2a2a4a; color: #ccc; }
    .toast.success { background: #1a3a2a; color: #00d4aa; border: 1px solid #00d4aa44; }
    .toast.error   { background: #3a1a1a; color: #ff6b6b; border: 1px solid #ff475744; }

    /* ====== 底部信息 ====== */
    .footer {
      margin-top: 16px;
      text-align: center;
      font-size: 10px;
      color: #555;
      border-top: 1px solid #2a2a4a;
      padding-top: 10px;
    }
  </style>
</head>
<body>

  <!-- 头部 -->
  <div class="header">
    <h1>🦀 KodaClaw Browser Bridge</h1>
    <div class="subtitle">Browser Automation Bridge v0.1.0</div>
  </div>

  <!-- 连接状态 -->
  <div class="status-bar">
    <div class="status-dot" id="statusDot"></div>
    <span class="status-text" id="statusText">未连接</span>
  </div>

  <!-- 设备信息（配对后显示） -->
  <div class="device-info" id="deviceInfo">
    <div class="device-label">已配对设备</div>
    <div class="device-id" id="deviceId">—</div>
    <div class="device-paired" id="pairedAt"></div>
  </div>

  <!-- Gateway 地址 -->
  <div class="form-group">
    <label for="gatewayAddress">Gateway 地址</label>
    <input
      type="text"
      id="gatewayAddress"
      placeholder="localhost:5076"
      value="localhost:5076"
    />
  </div>

  <!-- 配对 Token -->
  <div class="form-group">
    <label for="pairingToken">配对 Token</label>
    <div class="token-display">
      <input
        type="text"
        id="pairingToken"
        placeholder="输入配对 Token"
      />
      <span class="token-status" id="tokenStatus">⚠️</span>
    </div>
  </div>

  <!-- 操作按钮 -->
  <div class="button-group">
    <button class="btn btn-primary" id="btnPair">配对</button>
    <button class="btn btn-danger" id="btnDisconnect" disabled>断开</button>
  </div>

  <!-- Toast 通知容器 -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- 底部 -->
  <div class="footer">
    KodaClaw Browser Bridge &copy; 2024
  </div>

  <!-- 脚本 -->
  <script src="popup.js"></script>

</body>
</html>
