name: Docker — Build & Publish KodaClaw

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"           # v1.0.0, v1.2.3-beta.1, etc.
    paths:
      - "products/KodaClaw/**"
      - ".github/workflows/docker-publish.yml"
  pull_request:
    branches:
      - main
    paths:
      - "products/KodaClaw/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:       # 支持手动触发

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/kodaclaw

jobs:
  build-and-push:
    name: Build & Push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write    # 发布到 ghcr.io 需要

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up QEMU (多平台交叉编译) ────────────────────────────────────────
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # ── 3. Set up Docker Buildx ────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 4. Login to GitHub Container Registry ─────────────────────────────────
      #    PR 不登录（只 build，不 push）
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 5. Extract metadata (tags & labels) ───────────────────────────────────
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # main 分支 → :latest
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # Git tag v1.2.3 → :1.2.3  :1.2  :1
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # PR → :pr-42 (只 build，不 push)
            type=ref,event=pr
            # 每次 push 附上 SHA 短码
            type=sha,prefix=sha-,format=short

      # ── 6. Build (and optionally push) ────────────────────────────────────────
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .                         # 仓库根（SDK 跨仓库引用需要）
          file: products/KodaClaw/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 使用 GitHub Actions cache 加速层缓存
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 7. Print image digest ──────────────────────────────────────────────────
      - name: Print image digest
        if: github.event_name != 'pull_request'
        run: echo "Published ${{ steps.meta.outputs.tags }}"
