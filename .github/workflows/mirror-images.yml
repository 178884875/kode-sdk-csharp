name: Mirror — Sync third-party images to ACR

# Keeps domestic-friendly copies of images that KodaClaw depends on.
# Runs weekly and can be triggered manually.
#
# Required Secrets (same as docker-publish.yml):
#   ALIYUN_REGISTRY_USER     — ACR username
#   ALIYUN_REGISTRY_PASSWORD — ACR password

on:
  schedule:
    - cron: "0 2 * * 1"      # Every Monday 02:00 UTC
  workflow_dispatch:           # Manual trigger

env:
  ACR_REGISTRY: registry.cn-hangzhou.aliyuncs.com
  ACR_NAMESPACE: vanzheng

jobs:
  mirror:
    name: Mirror ${{ matrix.source }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - source: searxng/searxng:latest
            target: searxng:latest

    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USER }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Pull, re-tag, and push ${{ matrix.source }}
        run: |
          SOURCE="${{ matrix.source }}"
          TARGET="${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ matrix.target }}"

          echo "▶ Mirroring $SOURCE → $TARGET (linux/amd64 + linux/arm64)"

          docker buildx imagetools create \
            --tag "$TARGET" \
            "$SOURCE"

          echo "✓ Done: $TARGET"
